# GameShow - Render 部署配置（免费层）
services:
  - type: web
    name: gameshow
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      # Cloudflare D1 数据库
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Supabase Storage 图片存储
      - key: SUPA_PROJECT_URL
        sync: false
      - key: SUPA_SECRET_KEY
        sync: false
      - key: SUPA_BUCKET
        sync: false
