# GameShow - Render 部署配置（免费层）
services:
  - type: web
    name: gameshow
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      # Cloudflare D1 数据库
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Backblaze B2 图片存储
      - key: B2_ENDPOINT
        sync: false
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_PUBLIC_URL
        sync: false
